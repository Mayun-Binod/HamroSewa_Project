{% extends 'base.html' %}
{% load static %}
{% block title %} Home {% endblock title %}
{% block css %}
<style>
    /* Additional Styling for Form */
    .contact {
        background-color: #f8f9fa;
        min-height: 100vh;
    }

    .contact-form {
        background-color: #ffffff;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .contact-form h3 {
        font-size: 2rem;
        color: #5c6bc0;
        margin-bottom: 20px;
    }

    .form-group label {
        font-size: 1rem;
        color: #495057;
    }

    .form-control {
        border-radius: 25px;
        border: 1px solid #ced4da;
        padding: 10px;
        font-size: 1rem;
    }

    .form-control:focus {
        border-color: #7c4dff; /* Purple color on focus */
        box-shadow: 0 0 0 0.25rem rgba(124, 77, 255, 0.25);
    }

    .btn-primary {
        background-color: #7c4dff;
        border-color: #7c4dff;
        border-radius: 25px;
        padding: 10px 20px;
        font-size: 1.1rem;
        transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #5e35b1;
        border-color: #5e35b1;
    }

    .container-fluid.contact {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 0;
    }

    /* Styling for the map */
    .map-container {
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        height: 400px; /* You can adjust the height as needed */
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .contact-form {
            width: 100%;
        }

        .map-container {
            width: 100%;
            height: 250px; /* Adjust map height on smaller screens */
        }
    }
</style>
{% endblock css %}
{% block body %}

<!-- Contact Form -->
<div class="container-fluid contact d-flex align-items-center">
    <div class="row w-100">
        <!-- Left Side Form -->
        <div class="col-md-6">
            <div class="contact-form">
                <h3>Contact HamroSewa Admin</h3>
                <form action="#" method="post">
                    {% csrf_token %}
                    <div class="form-group mb-3">
                        <label for="name">Name</label>
                        <input type="text" class="form-control w-75" id="name" name="name" placeholder="Enter Name: " aria-describedby="name">
                    </div>

                    <div class="form-group mb-3">
                        <label for="email">Email address</label>
                        <input type="email" class="form-control w-75" id="email" name="email" placeholder="Enter Email address:" aria-describedby="emailHelp">
                    </div>

                    <div class="form-group mb-3">
                        <label for="phone">Phone Number</label>
                        <input type="tel" class="form-control w-75" id="phone" name="phone" placeholder="Enter Phone Number: ">
                    </div>

                    <div class="form-group mb-3">
                        <label for="content">Describe your issue :</label>
                        <textarea class="form-control w-75" name="content" id="content" placeholder="Enter your message:" cols="30" rows="5"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary my-3 w-75">Submit</button>
                </form>
            </div>
        </div>

        <!-- Right Side Map -->
        <div class="col-md-6">
            <div class="map-container">
                <!-- Embed Google Map -->
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14134.767362215465!2d85.3137382564615!3d27.665004369306466!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39eb19da0758c081%3A0x2a3ed12f74626419!2sLagankhel%2C%20Lalitpur!5e0!3m2!1sen!2snp!4v1731230428258!5m2!1sen!2snp" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>
    </div>
</div>

{% endblock body %}
