{% extends 'base.html' %}
{% block title %} Search Page {% endblock %}

{% block css %}
<style>
    body {
        background-color: #566264;
    }
    .img {
        min-height: 60vh;
    }
    .img::before {
        content: '';
        min-height: 75vh;
        width: 100%;
        position: absolute;
        top: 11vh;
        margin-left: 0;
   
    }
    .card {
        background-color: #14b1dd;
        height: 50%;
        width: 50%;
        margin-left: 100px;
        margin: 10.5rem 0;
    }
</style>
{% endblock %}

{% block body %}
<div class="container-fluid img">
    <div class="container">
        <div class="card p-2 mx-auto">
            <h3 class="text-center">Search Service Provider</h3>
            
            <form action="" method="POST">
                {% csrf_token %}

                <div class="form-group m-2">
                    <label>Select the City:</label>
                    <select class="form-select" aria-label="Cities" name="city" required>
                        <option value="">Select a City</option>
                        {% for i in cities %}
                            <option value="{{ i.id }}">{{ i }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group m-2">
                    <label>Select the Service:</label>
                    <select class="form-select" aria-label="Service" name="service" required>
                        <option value="">Select a Service</option>
                        {% for i in services %}
                            <option value="{{ i.service_id }}">{{ i }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <button type="submit" class="btn btn-primary m-3">Search</button>
                </div>
            </form>

            {% if error %}
                <div class="alert alert-danger text-center" role="alert">
                    {{ error }}
                </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
