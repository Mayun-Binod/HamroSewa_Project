<div class="container my-5 p-4 shadow-lg rounded" style="max-width: 600px; background-color: #f8f9fa;">
    <h2 class="text-center mb-4">Edit City</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group mb-3">
            {{ form.as_p }}
        </div>
        <div class="d-flex justify-content-between mt-4">
            <button type="submit" class="btn btn-primary px-4">Save Changes</button>
            <a href="{% url 'city_list' %}" class="btn btn-secondary px-4">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
